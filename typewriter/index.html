<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>Typewriter</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#efe7d8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    /* light theme (also the default before any JS) */
    /* --fg is UI text on --bg; --ink is typewriter text on --paper (kept separate
       so dark mode doesn't paint dark UI text on a dark background) */
    --bg:#efe7d8; --fg:#26313a; --ink:#26313a; --paper:#fffdf6; --paper-edge:#d8cdb8;
    --body:#2f6f6a; --body-2:#27605c; --body-3:#1f4f4b;
    --deck:#244f4b; --wall:#1a423f;
    --platen:#2b2b30; --platen-hi:#43434c; --knob:#191a1e; --knob-hi:#3a3b42;
    --bail:#5a5a62;
    --keycap:#f4efe6; --key-edge:#cfc6b6; --key-ink:#393a3c; --key-down:#e2dbc9;
    --keyfn:#d9cdb6; --typebar:#2f2f34;
    --panel:#fffdf6; --btn-bg:#fffdf6; --btn-edge:#26313a; --shadow:#26313a;
    --muted:#6c6157;
    color-scheme:light;
  }
  /* dark theme, following the OS preference */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e1016; --fg:#e8ebf2; --ink:#2a2620; --paper:#ece6d7; --paper-edge:#bcb39d;
      --body:#2a625d; --body-2:#21524e; --body-3:#173e3b;
      --deck:#173e3b; --wall:#102e2c;
      --platen:#121218; --platen-hi:#30313b; --knob:#08080c; --knob-hi:#2a2c38;
      --bail:#4a505c;
      --keycap:#333a49; --key-edge:#525a6b; --key-ink:#e6e9f0; --key-down:#444c5d;
      --keyfn:#3f4859; --typebar:#525a66;
      --panel:#171b24; --btn-bg:#171b24; --btn-edge:#b9c2d4; --shadow:#05070c;
      --muted:#9aa3b5;
      color-scheme:dark;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 14px max(env(safe-area-inset-bottom), 14px);
    overflow-x: hidden;
  }

  header { text-align: center; margin: clamp(10px,3vw,24px) 0 6px; }
  header h1 {
    font-family: 'Cutive Mono', monospace; font-weight: 400;
    font-size: clamp(26px,6vw,40px); letter-spacing: 0.04em;
  }
  header p { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .stage { position: relative; width: 100%; max-width: 660px; touch-action: manipulation; }
  #tw { display: block; width: 100%; height: auto; cursor: text; }

  /* hidden capture field — raises the mobile soft keyboard, never blocks clicks */
  #cap {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; border: 0; background: transparent; resize: none;
    pointer-events: none; font-size: 16px; /* >=16px avoids iOS focus zoom */
  }

  /* ---- SVG element styling, driven by theme variables ---- */
  .paper      { fill: var(--paper); stroke: var(--paper-edge); stroke-width: 1.5; }
  .ink        { fill: var(--ink); font-family: 'Cutive Mono', 'Courier New', monospace; font-size: 18px; }
  .cursor     { fill: var(--ink); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .body       { fill: var(--body); }
  .body-2     { fill: var(--body-2); }
  .body-3     { fill: var(--body-3); }
  .deck       { fill: var(--deck); }
  .wall       { fill: var(--wall); }
  .scale      { stroke: var(--bail); stroke-width: 2; opacity: 0.5; }
  .platen     { fill: var(--platen); }
  .platen-hi  { fill: var(--platen-hi); }
  .knob       { fill: var(--knob); }
  .knob-hi    { fill: var(--knob-hi); }
  .bail       { fill: var(--bail); }
  .typebar    { fill: var(--typebar); transform-box: fill-box; transform-origin: bottom center; transform: rotate(72deg); }
  .lever      { fill: var(--knob); cursor: pointer; transform-box: fill-box; transform-origin: bottom right; transition: transform .12s ease; }
  .lever:active, .lever.pull { transform: rotate(-26deg); }

  .key        { cursor: pointer; }
  .keycap     { fill: var(--keycap); stroke: var(--key-edge); stroke-width: 1.5; transition: transform .07s ease, fill .07s ease; }
  .key.fn .keycap { fill: var(--keyfn); }
  .keytext    { fill: var(--key-ink); font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .key.down .keycap { transform: translateY(3px); fill: var(--key-down); }
  .key.down .keytext { transform: translateY(3px); }
  .keytext, .keycap { transition: transform .07s ease, fill .07s ease; }

  /* type-bar slides along to the active column (and back on return) */
  #typebarPos { transition: transform 70ms linear; }
  #typebarPos.returning { transition: transform 240ms cubic-bezier(.2,.7,.2,1); }
  /* paper feeds up smoothly on carriage return */
  #paperFeed { transition: transform 240ms cubic-bezier(.18,.7,.2,1); }

  /* ---- controls ---- */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 16px 0 6px; }
  button {
    font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    color: var(--fg); background: var(--btn-bg);
    border: 2px solid var(--btn-edge); border-radius: 999px;
    padding: 9px 16px; box-shadow: 3px 3px 0 var(--shadow);
    transition: transform .12s, box-shadow .12s; -webkit-tap-highlight-color: transparent;
  }
  button:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--shadow); }
  button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--shadow); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 2px; transition: opacity .6s ease; }
  .hint.faded { opacity: 0; }

  /* ---- view-document overlay ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(0,0,0,.45); backdrop-filter: blur(3px);
    padding: max(env(safe-area-inset-top),20px) 16px max(env(safe-area-inset-bottom),20px);
    overflow: auto;
  }
  .overlay.open { display: flex; flex-direction: column; align-items: center; }
  /* a full sheet of paper: US-Letter aspect, generous margins, soft drop shadow */
  .doc {
    background: var(--paper); color: var(--ink);
    width: 100%; max-width: 560px; margin: 0 auto 18px; border-radius: 2px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    padding: clamp(40px,9%,72px) clamp(30px,11%,84px);
    border: 1px solid var(--paper-edge);
    aspect-ratio: 8.5 / 11; min-height: min(80vh, 720px);
    overflow: auto;
  }
  .doc h2 {
    font-family: 'Cutive Mono', monospace; font-weight: 400; font-size: 12px;
    color: var(--muted); margin-bottom: 22px; letter-spacing: .18em;
    text-align: center; opacity: .7;
  }
  .doc pre {
    font-family: 'Cutive Mono', 'Courier New', monospace; font-size: 16px; line-height: 1.8;
    white-space: pre-wrap; word-break: break-word; min-height: 1.8em;
  }
  .doc .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
  <header>
    <h1>Typewriter</h1>
    <p>Tap the machine and start typing.</p>
  </header>

  <div class="stage" id="stage">
    <svg id="tw" viewBox="0 0 760 600" role="img" aria-label="An interactive typewriter">
      <defs>
        <!-- the paper window: typed text feeds up through here and is clipped at the top -->
        <clipPath id="paperClip"><rect x="146" y="0" width="468" height="312"/></clipPath>
        <linearGradient id="paperShade" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="rgba(0,0,0,0.07)"/>
          <stop offset="0.05" stop-color="rgba(0,0,0,0)"/>
          <stop offset="0.95" stop-color="rgba(0,0,0,0)"/>
          <stop offset="1" stop-color="rgba(0,0,0,0.07)"/>
        </linearGradient>
      </defs>

      <!-- carriage rail / deck behind the platen -->
      <rect class="deck" x="40" y="246" width="680" height="90" rx="14"/>
      <line class="scale" x1="74" y1="252" x2="686" y2="252"/>

      <!-- the sheet of paper + printed text; feeds UP on return (vertical only, so it
           stays centred and never slides off-screen). The type-bar travels along the
           line instead, keeping the whole line on the page at all times.
           The clip is on the STATIC wrapper, not on #paperFeed: a userSpaceOnUse clip
           on a translated element moves with it, which would drift the window off the
           machine after a few returns. -->
      <g clip-path="url(#paperClip)">
        <g id="paperFeed">
          <rect class="paper" x="150" y="120" width="460" height="1900" rx="7"/>
          <rect x="150" y="120" width="460" height="1900" rx="7" fill="url(#paperShade)"/>
          <g id="textLayer"></g>
        </g>
      </g>

      <!-- platen roller + knobs (drawn over the paper so it appears to wrap behind) -->
      <rect class="platen" x="140" y="252" width="480" height="52" rx="26"/>
      <rect class="platen-hi" x="140" y="260" width="480" height="9" rx="4" opacity="0.55"/>
      <circle class="knob" cx="140" cy="278" r="30"/>
      <circle class="knob-hi" cx="140" cy="278" r="15"/>
      <circle class="knob" cx="620" cy="278" r="30"/>
      <circle class="knob-hi" cx="620" cy="278" r="15"/>

      <!-- paper bail with rollers, just below the printing line -->
      <rect class="bail" x="170" y="246" width="420" height="6" rx="3"/>
      <circle class="bail" cx="210" cy="249" r="7"/>
      <circle class="bail" cx="560" cy="249" r="7"/>

      <!-- carriage-return lever (clickable), on the left of the platen -->
      <g id="lever" class="lever" tabindex="0" role="button" aria-label="Carriage return">
        <rect x="72" y="204" width="74" height="12" rx="6"/>
        <circle cx="72" cy="210" r="10"/>
      </g>

      <!-- side walls framing the platen -->
      <rect class="wall" x="32" y="238" width="40" height="98" rx="12"/>
      <rect class="wall" x="688" y="238" width="40" height="98" rx="12"/>

      <!-- type-bar arm: positioned under the active column (by JS) and swung up to strike -->
      <g id="typebarPos">
        <g id="typebar" class="typebar">
          <rect x="-4" y="238" width="8" height="96" rx="4"/>
          <rect x="-11" y="230" width="22" height="16" rx="3"/>
        </g>
      </g>

      <!-- machine body / keyboard housing -->
      <path class="body" d="M 70 588 Q 46 588 48 560 L 70 332 Q 74 312 108 312 L 652 312 Q 686 312 690 332 L 712 560 Q 714 588 690 588 Z"/>
      <rect class="body-2" x="118" y="320" width="524" height="18" rx="9" opacity="0.55"/>
      <path class="body-3" d="M 64 560 L 696 560 L 712 560 Q 714 588 690 588 L 70 588 Q 46 588 48 560 Z"/>

      <!-- keyboard (keys injected by script) -->
      <g id="keys"></g>
    </svg>
    <textarea id="cap" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true"></textarea>
  </div>

  <div class="controls">
    <button id="btn-view">View document</button>
    <button id="btn-reset">Reset</button>
  </div>
  <p class="hint" id="hint">A physical keyboard works too. Press Return for a new line.</p>

  <!-- view-document overlay -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="doc">
      <h2>YOUR DOCUMENT</h2>
      <pre id="doc-body"></pre>
    </div>
    <div class="controls">
      <button id="btn-share">Share</button>
      <button id="btn-copy">Copy</button>
      <button id="btn-download">Download</button>
      <button id="btn-close">Close</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ----- geometry (SVG user units) -----
  // The sheet stays centred and only feeds UP on return, so the page can never
  // slide off-screen. col0X is the page's left margin; column c sits at
  // col0X + c*charW. The line width (maxChars*charW) fits inside the sheet, so a
  // whole line is always visible; the type-bar travels to the active column.
  var charW = 12, lineH = 24, maxChars = 30, col0X = 196, printY = 238;

  // ----- document model: typewriter-style, edits only at the current line end -----
  var lines = [""], cur = 0;
  function colLen() { return lines[cur].length; }
  function cursorX() { return col0X + colLen() * charW; }

  var SVGNS = "http://www.w3.org/2000/svg";
  var paperFeed = document.getElementById("paperFeed");
  var textLayer = document.getElementById("textLayer");
  var typebar = document.getElementById("typebar");
  var typebarPos = document.getElementById("typebarPos");

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function render() {
    paperFeed.setAttribute("transform", "translate(0," + (-cur * lineH) + ")");

    var out = "";
    for (var L = 0; L < lines.length; L++) {
      var y = printY + L * lineH, s = lines[L], tsp = "";
      for (var c = 0; c < s.length; c++) {
        tsp += '<tspan x="' + (col0X + c * charW) + '">' + esc(s[c]) + "</tspan>";
      }
      out += '<text class="ink" y="' + y + '">' + tsp + "</text>";
    }
    var cy = printY + cur * lineH + 3;
    out += '<rect class="cursor" x="' + cursorX() + '" y="' + cy + '" width="' + (charW - 2) + '" height="3"/>';
    textLayer.innerHTML = out;

    // park the type-bar under the last typed character (or the left margin)
    var barX = col0X + Math.max(0, colLen() - 1) * charW;
    typebarPos.setAttribute("transform", "translate(" + barX + ",0)");
  }

  // ----- key map for press animation + click-to-type -----
  var keyEls = {}; // data-key -> element

  function flashKey(k) {
    var el = keyEls[k];
    if (!el) return;
    el.classList.add("down");
    setTimeout(function () { el.classList.remove("down"); }, 110);
  }

  function strike() {
    if (typebar.animate) {
      typebar.animate(
        [{ transform: "rotate(72deg)" }, { transform: "rotate(0deg)" }, { transform: "rotate(72deg)" }],
        { duration: 130, easing: "ease-out" }
      );
    }
  }

  // ----- actions -----
  // fade the instruction line out the first time the user actually types
  var hintEl = document.getElementById("hint"), hintFaded = false;
  function fadeHint() { if (!hintFaded) { hintFaded = true; hintEl.classList.add("faded"); } }

  function type(ch) {
    fadeHint();
    if (colLen() >= maxChars) doReturn();   // soft right-margin: auto-wrap to a new line
    lines[cur] += ch;
    flashKey(ch === " " ? " " : ch.toLowerCase());
    render();   // positions the type-bar under the new character...
    strike();   // ...then swing it up to strike
  }

  function doReturn() {
    fadeHint();
    lines.push("");
    cur++;
    typebarPos.classList.add("returning");   // carriage slides back to the left margin
    flashKey("Enter");
    render();
    setTimeout(function () {
      typebarPos.classList.remove("returning");
    }, 260);
  }

  function backspace() {
    fadeHint();
    if (colLen() > 0) lines[cur] = lines[cur].slice(0, -1);
    else if (cur > 0) { lines.pop(); cur--; }
    flashKey("Backspace");
    render();
  }

  function reset() {
    lines = [""]; cur = 0;
    render();
  }

  function docText() {
    return lines.join("\n").replace(/\s+$/, "");
  }

  // ----- build the keyboard -----
  (function buildKeyboard() {
    var g = document.getElementById("keys");
    var R = 16;

    function addKey(cx, cy, label, dataKey, fn, w) {
      var key = document.createElementNS(SVGNS, "g");
      key.setAttribute("class", "key" + (fn ? " fn" : ""));
      var cap = document.createElementNS(SVGNS, "rect");
      var width = w || R * 2, height = R * 2;
      cap.setAttribute("class", "keycap");
      cap.setAttribute("x", cx - width / 2);
      cap.setAttribute("y", cy - height / 2);
      cap.setAttribute("width", width);
      cap.setAttribute("height", height);
      cap.setAttribute("rx", fn ? 9 : R);
      var txt = document.createElementNS(SVGNS, "text");
      txt.setAttribute("class", "keytext");
      txt.setAttribute("x", cx);
      txt.setAttribute("y", cy);
      if (w) txt.setAttribute("font-size", "11");
      txt.textContent = label;
      key.appendChild(cap); key.appendChild(txt);
      key.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        if (dataKey == null) { cap_focus(); return; }   // decorative key (e.g. shift)
        if (dataKey === "Enter") doReturn();
        else if (dataKey === "Backspace") backspace();
        else type(dataKey);
        cap_focus();
      });
      if (dataKey != null) keyEls[dataKey] = key;
      g.appendChild(key);
    }

    var rows = [
      { y: 362, start: 191, chars: "1234567890" },
      { y: 404, start: 191, chars: "qwertyuiop" },
      { y: 446, start: 212, chars: "asdfghjkl" },
      { y: 488, start: 254, chars: "zxcvbnm" }
    ];
    rows.forEach(function (row) {
      for (var i = 0; i < row.chars.length; i++) {
        var ch = row.chars[i];
        addKey(row.start + i * 42, row.y, ch.toUpperCase(), ch, false);
      }
    });

    // function keys
    addKey(615, 362, "del", "Backspace", true, 60);
    addKey(610, 446, "return", "Enter", true, 78);
    addKey(188, 488, "shift", null, true, 64);
    addKey(380, 530, "", " ", false, 250); // space bar
  })();

  // ----- input capture (physical + soft keyboard) -----
  var cap = document.getElementById("cap");
  function cap_focus() { try { cap.focus({ preventScroll: true }); } catch (e) { cap.focus(); } }

  window.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return; // leave browser shortcuts alone
    if (document.getElementById("overlay").classList.contains("open")) return;
    if (e.key === "Enter") { e.preventDefault(); doReturn(); }
    else if (e.key === "Backspace") { e.preventDefault(); backspace(); }
    else if (e.key.length === 1) { e.preventDefault(); type(e.key); }
  });

  // fallback for soft keyboards that don't emit useful keydown events
  cap.addEventListener("input", function () {
    var v = cap.value;
    cap.value = "";
    if (!v || document.getElementById("overlay").classList.contains("open")) return;
    for (var i = 0; i < v.length; i++) {
      if (v[i] === "\n") doReturn(); else type(v[i]);
    }
  });

  // tapping the machine summons the mobile keyboard (focus inside the gesture)
  document.getElementById("stage").addEventListener("pointerdown", function () { cap_focus(); });

  // carriage-return lever
  var lever = document.getElementById("lever");
  function pullLever() {
    lever.classList.add("pull");
    setTimeout(function () { lever.classList.remove("pull"); }, 180);
    doReturn();
  }
  lever.addEventListener("pointerdown", function (e) { e.preventDefault(); e.stopPropagation(); pullLever(); cap_focus(); });
  lever.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pullLever(); } });

  // ----- controls -----
  document.getElementById("btn-reset").addEventListener("click", function () {
    if (docText() && !confirm("Clear the page and start over?")) return;
    reset(); cap_focus();
  });

  var overlay = document.getElementById("overlay");
  var docBody = document.getElementById("doc-body");
  document.getElementById("btn-view").addEventListener("click", function () {
    var t = docText();
    if (t) { docBody.textContent = t; docBody.className = ""; }
    else { docBody.textContent = "Nothing typed yet."; docBody.className = "empty"; }
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
  });
  document.getElementById("btn-close").addEventListener("click", closeOverlay);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeOverlay(); });
  function closeOverlay() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
  }

  document.getElementById("btn-share").addEventListener("click", function () {
    var text = docText();
    if (!text) { alert("Type something first."); return; }
    if (navigator.share) {
      navigator.share({ title: "My typewritten note", text: text }).catch(function () {});
    } else {
      copyText(text, "Sharing isn't supported here, so the text was copied instead.");
    }
  });
  document.getElementById("btn-copy").addEventListener("click", function () {
    copyText(docText(), "Copied to clipboard.");
  });
  function copyText(text, msg) {
    if (!text) { alert("Type something first."); return; }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () { toast(msg); }, function () { toast("Copy failed."); });
    } else {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast(msg); } catch (e) { toast("Copy failed."); }
      document.body.removeChild(ta);
    }
  }
  document.getElementById("btn-download").addEventListener("click", function () {
    var text = docText();
    if (!text) { alert("Type something first."); return; }
    var blob = new Blob([text], { type: "text/plain" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "typewriter.txt";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast");
    if (!t) {
      t = document.createElement("div"); t.id = "toast";
      t.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);" +
        "background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;" +
        "font:600 14px system-ui;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.3);";
      document.body.appendChild(t);
    }
    t.textContent = msg; t.style.opacity = "1";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.opacity = "0"; t.style.transition = "opacity .4s"; }, 1800);
  }

  // ----- theme: follow the OS preference; keep the chrome tint colour in sync -----
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  var meta = document.querySelector('meta[name="theme-color"]');
  function syncThemeColor() {
    meta.setAttribute("content", mq.matches ? "#0e1016" : "#efe7d8");
  }
  mq.addEventListener("change", syncThemeColor);
  syncThemeColor();

  // ----- boot -----
  render();
  cap_focus();
})();
</script>
