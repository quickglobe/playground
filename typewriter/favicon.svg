<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00bdbd"/>
      <stop offset="100%" stop-color="#5293e5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>

  <!-- Sheet of paper rising out of the machine -->
  <rect x="170" y="66" width="172" height="168" rx="10" fill="#fffdf6"/>
  <!-- Typed lines on the paper -->
  <rect x="196" y="104" width="120" height="13" rx="6" fill="#2f6f6a"/>
  <rect x="196" y="134" width="92"  height="13" rx="6" fill="#2f6f6a"/>
  <rect x="196" y="164" width="108" height="13" rx="6" fill="#2f6f6a"/>

  <!-- Platen roller -->
  <rect x="120" y="214" width="272" height="44" rx="22" fill="#1f3b39"/>
  <circle cx="120" cy="236" r="30" fill="#162c2a"/>
  <circle cx="392" cy="236" r="30" fill="#162c2a"/>

  <!-- Machine body -->
  <path d="M 116 446 Q 96 446 100 414 L 116 304 Q 120 286 150 286 L 362 286 Q 392 286 396 304 L 412 414 Q 416 446 396 446 Z" fill="#1f4f4b"/>

  <!-- Keys -->
  <g fill="#fffdf6">
    <circle cx="168" cy="346" r="17"/>
    <circle cx="212" cy="346" r="17"/>
    <circle cx="256" cy="346" r="17"/>
    <circle cx="300" cy="346" r="17"/>
    <circle cx="344" cy="346" r="17"/>
    <circle cx="190" cy="392" r="17"/>
    <circle cx="234" cy="392" r="17"/>
    <circle cx="278" cy="392" r="17"/>
    <circle cx="322" cy="392" r="17"/>
  </g>
  <!-- Space bar -->
  <rect x="186" y="424" width="140" height="20" rx="10" fill="#fffdf6"/>
</svg>
