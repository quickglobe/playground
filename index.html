<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="mask-icon" href="safari-pinned-tab.svg" color="#00bdbd">
<meta name="msapplication-config" content="browserconfig.xml">
<meta name="msapplication-TileColor" content="#00bdbd">
<meta name="theme-color" content="#00bdbd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.96 0.02 220);
    --text: oklch(0.26 0.04 255);
    --muted: oklch(0.5 0.04 250);
    --card-brd: oklch(0.26 0.04 255);
    --surface: oklch(1 0 0);
    --teal: oklch(0.72 0.13 195);
    --teal-soft: oklch(0.9 0.07 195);
    --blue: oklch(0.66 0.14 255);
    --blue-soft: oklch(0.89 0.06 255);
    --shadow-col: oklch(0.26 0.04 255);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(0.2 0.03 255); --text: oklch(0.95 0.015 220); --muted: oklch(0.72 0.03 245);
      --card-brd: oklch(0.85 0.05 230); --surface: oklch(0.26 0.035 255);
      --teal: oklch(0.78 0.13 195); --teal-soft: oklch(0.4 0.08 195);
      --blue: oklch(0.74 0.14 255); --blue-soft: oklch(0.38 0.09 255); --shadow-col: oklch(0.08 0.02 255);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 42% 58% 60% 40% / 45% 45% 55% 55%; opacity: 0.5; filter: blur(2px); }
  .b1 { width: 240px; height: 240px; background: var(--teal-soft); top: 12%; right: -60px; animation: float 14s ease-in-out infinite; }
  .b2 { width: 180px; height: 180px; background: var(--blue-soft); bottom: 8%; left: -50px; animation: float 18s ease-in-out infinite reverse; }
  .b3 { width: 120px; height: 120px; background: var(--teal-soft); top: 60%; right: 14%; animation: float 11s ease-in-out infinite; }
  @keyframes float { 0%,100%{ transform: translateY(0) rotate(0); } 50%{ transform: translateY(-26px) rotate(18deg); } }

  .wrap { max-width: 1280px; margin: 0 auto; padding: clamp(28px,6vw,64px) clamp(20px,5vw,48px) 80px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: clamp(36px,7vw,64px); }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(38px,8vw,64px); letter-spacing: -0.02em; line-height: 1.0; }
  .brand h1 .pop { display: inline-block; color: var(--teal); transform-origin: bottom; }
  @keyframes wiggle { 0%,100%{ transform: rotate(0); } 30%{ transform: rotate(-9deg); } 65%{ transform: rotate(7deg); } }
  @media (hover: hover) { .brand h1:hover .pop { animation: wiggle 0.5s ease-in-out 1; } }
  .brand p { font-size: clamp(15px,2.5vw,18px); color: var(--muted); margin-top: 16px; font-weight: 500; }

  .grid { display: grid; grid-template-columns: 1fr; gap: clamp(16px,3vw,24px); }
  .card-wrap {
    background: var(--card-brd); padding: 3px; border-radius: 29px;
    will-change: transform;
  }
  @media (hover: hover) and (pointer: fine) {
    .card-wrap { transition: transform 0.22s cubic-bezier(.34,1.56,.64,1); }
    .card-wrap:has(.card:hover) { transform: translate(-4px,-4px); }
    .card-wrap:has(.card:active) { transform: translate(2px,2px); }
  }
  .card-wrap:has(.card:focus-visible) { outline: 3px solid var(--blue); outline-offset: 4px; }
  .card {
    text-decoration: none; color: inherit; background: var(--surface);
    border-radius: 26px; padding: 14px; position: relative; display: block;
    /* Fill the grid-stretched wrapper so the 3px frame stays uniform on all
       four sides. Without this, shorter cards leave the dark .card-wrap
       background showing as a band at the bottom (reads as a stray "shadow"),
       which only appears on desktop where the grid stretches cards to equal
       height — not on mobile's single column. */
    height: 100%;
  }
  .preview-wrap { background: var(--card-brd); padding: 3px; border-radius: 21px; }
  .preview { height: 172px; border-radius: 18px; overflow: hidden; position: relative; }
  .meta { padding: 16px 8px 8px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 11px; border-radius: 999px; border: 2px solid var(--card-brd); }
  .c-teal { background: var(--teal-soft); color: var(--text); }
  .c-blue { background: var(--blue-soft); color: var(--text); }
  .meta h2 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; margin: 12px 0 6px; letter-spacing: -0.01em; }
  .meta p { color: var(--muted); font-size: 14.5px; line-height: 1.5; font-weight: 500; }

  /* sun preview — canvas-rendered dusk scene matching the actual app */
  .sun-scene { width: 100%; height: 100%; display: block; }

  /* life preview — bg adapts to light/dark mode, matching the actual app palette.
     Rendered at CSS resolution + pixelated upscale (like the app) so cells and
     grid lines stay crisp instead of antialiasing under a fractional DPR. */
  .life-scene { width: 100%; height: 100%; display: block; background: #f0f4ff; image-rendering: pixelated; }
  @media (prefers-color-scheme: dark) { .life-scene { background: #1a1a2e; } }

  /* typewriter preview — themed bg with a fixed-colour SVG machine that reads on both */
  .type-scene { width: 100%; height: 100%; display: block; background: #efe7d8; }
  @media (prefers-color-scheme: dark) { .type-scene { background: #0e1016; } }

  /* sea glass preview — static SVG: Coastal pebbles behind two frosted pieces,
     colours taken from the app's palette and gamut-mapped glass tints */
  .glass-scene { width: 100%; height: 100%; display: block; }
  .glass-scene .sgbg { fill: #ece4d4; } .glass-scene .sgp0 { fill: #8fd3c4; } .glass-scene .sgp1 { fill: #2f9e8f; } .glass-scene .sgp2 { fill: #3e64a8; } .glass-scene .sgp3 { fill: #f2a477; } .glass-scene .sgp4 { fill: #e8c86a; } .glass-scene .sgp5 { fill: #d6694f; } .glass-scene .sgt0 { fill: #c3fcf0; fill-opacity: 0.32; } .glass-scene .sge0 { stroke: #00c6ae; } .glass-scene .sgt1 { fill: #e2f0ff; fill-opacity: 0.32; } .glass-scene .sge1 { stroke: #60b0ff; }
  @media (prefers-color-scheme: dark) { .glass-scene .sgbg { fill: #0d1b24; } .glass-scene .sgp0 { fill: #1f6f68; } .glass-scene .sgp1 { fill: #2fae9c; } .glass-scene .sgp2 { fill: #3456a0; } .glass-scene .sgp3 { fill: #c7653f; } .glass-scene .sgp4 { fill: #b08f2f; } .glass-scene .sgp5 { fill: #7a2f3b; } .glass-scene .sgt0 { fill: #005449; } .glass-scene .sge0 { stroke: #36d2ba; } .glass-scene .sgt1 { fill: #224a71; } .glass-scene .sge1 { stroke: #7cbdff; } }

  footer { margin-top: 54px; display: flex; gap: 14px; align-items: center; color: var(--muted); font-weight: 600; font-size: 14px; flex-wrap: wrap; }
  footer a { color: var(--text); text-decoration: none; padding: 6px 12px; border: 2px solid var(--card-brd); border-radius: 999px; background: var(--surface); transition: transform 0.15s; }
  footer a:hover { transform: translate(-2px,-2px); }

  /* Header actions: project count + GitHub — shown only on desktop */
  .header-actions { display: none; flex-direction: column; align-items: flex-end; gap: 14px; flex-shrink: 0; }
  .hdr-count { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .hdr-link { color: var(--text); text-decoration: none; padding: 8px 18px; border: 2px solid var(--card-brd); border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 14px; white-space: nowrap; }
  @media (hover: hover) and (pointer: fine) {
    .hdr-link { transition: transform 0.15s; }
    .hdr-link:hover { transform: translate(-2px,-2px); }
  }

  /* 2 columns from 600px */
  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 24px; }
  }

  /* 3-column desktop layout from 900px */
  @media (min-width: 900px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 28px; }
    .preview { height: 220px; }
    .card { padding: 16px; }
    .meta { padding: 20px 10px 10px; }
    .meta h2 { font-size: 26px; }
    .meta p { font-size: 15.5px; }
    /* Larger background blobs */
    .b1 { width: 380px; height: 380px; right: -100px; top: 8%; }
    .b2 { width: 300px; height: 300px; left: -80px; bottom: 6%; }
    .b3 { width: 200px; height: 200px; }
    /* Move GitHub link to header, hide from footer */
    .footer-gh { display: none; }
    .header-actions { display: flex; }
  }
</style>
</head>
<body>
<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Play<span class="pop">ground</span></h1>
      <p>Fun experiments &amp; side projects.</p>
    </div>
    <div class="header-actions">
      <span class="hdr-count" id="project-count"></span>
      <a href="https://github.com/quickglobe/playground" target="_blank" rel="noopener" class="hdr-link">GitHub ↗</a>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <footer><span>Made for the fun of it | 100% vibe-coded</span><a href="https://github.com/quickglobe/playground" target="_blank" rel="noopener" class="footer-gh">GitHub ↗</a></footer>
</div>

  const grid = document.getElementById("grid");
  PROJECTS.forEach(p => {
    const a = document.createElement("a"); a.className = "card"; a.href = p.url;
    a.innerHTML = `<div class="preview-wrap"><div class="preview">${previewHTML(p.preview)}</div></div>
      <div class="meta"><span class="chip ${p.chip}">${p.tag}</span><h2>${p.title}</h2><p>${p.desc}</p></div>`;
    const wrap = document.createElement("div"); wrap.className = "card-wrap";
    wrap.appendChild(a);
    grid.appendChild(wrap);
  });

  function startLife(canvas) {
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (!W || !H) return;
    // Render at CSS resolution; the canvas is upscaled to the device with
    // image-rendering: pixelated (set in CSS), exactly like the main app, so
    // every cell and grid line snaps to a whole pixel with no antialiasing.
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");

    // The main app sizes its box to an exact integer number of CELL-sized cells
    // so the grid is flush with the box border (no clipped cell, no gap). The
    // preview window is a fixed-size design element that can't be resized to the
    // grid, so instead the cells are stretched to fill it edge-to-edge: pick the
    // whole number of cells nearest the target size, then snap every cell
    // boundary to an integer pixel. Each cell is fully drawn (no overflow → no
    // clipped cells) and the grid reaches all four edges (no margin → no gap).
    const cell = 12;
    const cols = Math.max(1, Math.round(W/cell));
    const rows = Math.max(1, Math.round(H/cell));
    const colX = i => Math.round(i*W/cols);   // left edge of column i, snapped
    const rowY = j => Math.round(j*H/rows);    // top edge of row j, snapped

    let grid = seed();
    function seed(){ return Array.from({length:rows},()=>Array.from({length:cols},()=>Math.random()>0.72?1:0)); }
    function draw() {
      const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const bg   = dark ? '#1a1a2e' : '#f0f4ff';
      const line = dark ? 'rgba(15,52,96,0.6)' : 'rgba(150,165,220,0.5)';
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

      // Full cells spanning their snapped boundaries, inset by the 1px interior
      // line on the left/top edge so a live cell never paints over a grid line
      // (the overlap). The right/bottom line belongs to the next cell, which is
      // likewise inset, so every interior line keeps a clean 1px gap with cells
      // flush on both sides.
      ctx.fillStyle = '#e94560';
      for(let y=0;y<rows;y++)for(let x=0;x<cols;x++) if(grid[y][x]){
        const x0 = colX(x) + (x ? 1 : 0), y0 = rowY(y) + (y ? 1 : 0);
        ctx.fillRect(x0, y0, colX(x+1)-x0, rowY(y+1)-y0);
      }

      // Interior divisions only; the preview frame is the outer border, so the
      // edge lines (i==0/i==cols, j==0/j==rows) are left off to avoid doubling
      // up on the frame.
      ctx.strokeStyle = line; ctx.lineWidth = 1;
      ctx.beginPath();
      for(let x=1;x<cols;x++){ const px = colX(x) + 0.5; ctx.moveTo(px, 0); ctx.lineTo(px, H); }
      for(let y=1;y<rows;y++){ const py = rowY(y) + 0.5; ctx.moveTo(0, py); ctx.lineTo(W, py); }
      ctx.stroke();
    }
    function advance(){
      let alive = 0;
      const next = grid.map((row,y)=>row.map((s,x)=>{ let n=0;
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ if(dx||dy) n+=grid[(y+dy+rows)%rows][(x+dx+cols)%cols]; }
        const v=(n===3||(s&&n===2))?1:0; alive+=v; return v; }));
      grid = next; if (alive < cols*rows*0.04) grid = seed();
    }
    for (let i = 0; i < 5; i++) advance();
    draw();
    return draw;
  }
  function startSun(canvas) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (!W || !H) return;
    canvas.width = W*dpr; canvas.height = H*dpr;
    const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
    const horizonY = H, peakH = H*0.58;
    const sunriseMin = 348, sunsetMin = 1112, solarNoonMin = 730;
    // Palette directly from the actual app at alt ≈ 6° (low afternoon sun)
    // sky:#e8a574 horizon:#ffc88a bg:#c08254 → derived: mix(horizon,bg,0.35)=#e9b077 darken(bg,0.08)=#b1784d darken(bg,0.32)=#835839
    // All-sky dusk gradient — palette from actual app across civil dusk → just-after-sunset
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#2a2236');
    grad.addColorStop(0.45, '#3a324e');
    grad.addColorStop(0.8, '#85513a');
    grad.addColorStop(1, '#c4753a');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
    // Arc geometry helper — x spans the ±7h arc range so the sinusoidal shape fills the canvas
    const arcStart = solarNoonMin - 420, arcSpan = 840;
    function arcPt(m) {
      const hc = Math.cos(Math.PI*(sunsetMin-sunriseMin)/(60*24));
      const phi = ((m-solarNoonMin)/720)*Math.PI;
      return { x: ((m-arcStart)/arcSpan)*W, y: horizonY-(Math.cos(phi)-hc)/Math.max(1-hc,0.01)*peakH };
    }
    // Arc spanning ±7h from solar noon — below-horizon ends clip at canvas edge
    ctx.strokeStyle = 'rgba(224,138,106,0.65)'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i=0; i<=120; i++) {
      const pt = arcPt(arcStart + (i/120)*arcSpan);
      i===0 ? ctx.moveTo(pt.x,pt.y) : ctx.lineTo(pt.x,pt.y);
    }
    ctx.stroke();
    // Sun disc: late afternoon, well above horizon
    const sun = arcPt(solarNoonMin + 280);
    ctx.fillStyle = '#e08a6a';
    ctx.beginPath(); ctx.arc(sun.x, sun.y, 8, 0, Math.PI*2); ctx.fill();
  }
  function renderPreviews() {
    document.querySelectorAll(".life-scene").forEach(c => startLife(c));
    document.querySelectorAll(".sun-scene").forEach(startSun);
  }
  renderPreviews();
  // Re-render the static previews when the theme changes (the life preview's
  // colours track dark mode) and after a resize (the canvases render at CSS
  // resolution, so a width change would otherwise leave them stretched/blurry).
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderPreviews);
  let previewResizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(previewResizeTimer);
    previewResizeTimer = setTimeout(renderPreviews, 200);
  });
</script>
<script type="module">
  import { generateClipPath } from 'https://esm.sh/@lisse/core@0.4.0';

  function applySquircle(el, radius) {
    function update() {
      const { width, height } = el.getBoundingClientRect();
      if (width > 0 && height > 0) {
        el.style.clipPath = generateClipPath(width, height, { radius });
      }
    }
    new ResizeObserver(update).observe(el);
    update();
  }

  document.querySelectorAll('.card-wrap').forEach(el => applySquircle(el, 29));
  document.querySelectorAll('.card').forEach(el => applySquircle(el, 26));
  document.querySelectorAll('.preview-wrap').forEach(el => applySquircle(el, 21));
  document.querySelectorAll('.preview').forEach(el => applySquircle(el, 18));
</script>
